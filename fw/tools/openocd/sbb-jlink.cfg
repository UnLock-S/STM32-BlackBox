# 一键配置：SEGGER J-Link 接口 + STM32F103 目标，flash 容量**自动探测**
#
# 用法：
#   bash fw/tools/openocd.sh --jlink
#   openocd -s <本目录> -s <xPack scripts> -f sbb-jlink.cfg
#
# ── 为什么 J-Link 在纸面上更强 ──
#   · 上游 OpenOCD **自带** interface/jlink.cfg（ch347 则要自己写）
#   · SWD 时钟远高于 CH347T 那个 1 MHz 硬上限
#
# ═══════════════════════════════════════════════════════════════════════════
# ⚠️ 驱动前提（关键！国产克隆 V9 必读）—— 这一段会决定你要不要走这条路
# ═══════════════════════════════════════════════════════════════════════════
#   SEGGER 官方 KB（kb.segger.com/OpenOCD）原文：
#     "In order to use J-Link with OpenOCD the standard J-Link USB driver
#      must be replaced with the WinUSB driver, using 3rd party utilities."
#     "Current (since end 2022) models are already shipped by factory
#      configured for WinUSB, so the reconfiguration should no longer be
#      necessary."
#
#   → 也就是说：**只有 2022 年底之后出厂的型号才默认是 WinUSB**。
#     V9 克隆件是早年产品，**默认走 SEGGER 私有驱动，OpenOCD 认不到**，
#     必须先换成 WinUSB（Zadig，或 J-Link Configurator 里切 WinUSB 模式）。
#
#   ⚠ 换完之后 **SEGGER 全家桶就再也连不上它了**。SEGGER 官方 KB 原话：
#     "Once the J-Link USB driver has been replaced, no SEGGER software from
#      the J-Link software package will be able to communicate with J-Link
#      anymore."
#     想恢复：双击
#       C:\Program Files\SEGGER\JLink_V812g\USBDriver\InstDrivers.exe
#
#   OpenOCD 用 J-Link 的其他代价（SEGGER 官方 KB 列的 Limitations）：
#     · **比 SEGGER 自家 DLL 慢很多** —— OpenOCD 只把 J-Link 当"哑探针"，
#       走最低级的时序控制，不利用探针里的高级逻辑
#     · **不支持 RTT**
#     · 不支持 HSS（高速采样）
#     · 没有无限 flash 断点
#     · SEGGER 不提供任何支持
#
#   ⇒ 结论：对国产克隆件，**这条路性价比最低**（要毁掉 SEGGER 工具链，
#     换来的还只是"比 CH347T 快、但比 SEGGER 自家慢很多"的 SWD）。
#     真要用 J-Link 的性能，应该走 SEGGER 自家的 JLinkGDBServer + Cortex-Debug
#     （servertype: jlink），而不是 OpenOCD。本配置仅供需要时使用。
#
# ═══════════════════════════════════════════════════════════════════════════
#
# ── ⚠ J-Link V9 的两个注意点 ──
#   1. SEGGER 官方已把 V9（BASE / PLUS / EDU）列为 **legacy**，官方原文：
#        "This device has been superseded ... is not eligible for support by SEGGER."
#   2. 国产克隆件：SEGGER 自家软件可能识别为克隆并拒绝工作；
#      自动固件升级可能让它变砖（Hackaday 有专门的救砖文章）。
#      → **绝对不要接受 SEGGER 软件弹出的固件升级提示。**
#
# ── 若同时插着多个调试器（比如 CH347 + J-Link）──
#   用序列号把 J-Link 挑出来，取消下面这行注释并填上序列号：
# adapter serial 123456789

source [find interface/jlink.cfg]

transport select swd

# J-Link 的 SWD 频率可以开很高。先给 4000 kHz 起步；连不上就逐档往下降
# （2000 → 1000 → 500）。F103C8 上 4000 通常没问题。
adapter speed 4000

source [find target/stm32f1x.cfg]
