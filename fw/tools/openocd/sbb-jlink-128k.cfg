# 一键配置：SEGGER J-Link 接口 + STM32F103，**强制按 128 KB flash** 处理（TC-01 用）
#
# 用法：
#   bash fw/tools/openocd.sh --jlink --128k
#
# 原理：官方 target/stm32f1x.cfg 第 27–33 行本身就支持 FLASH_SIZE 变量覆盖，
#       在 source target 之前 set 即可，**不需要改 OpenOCD 安装目录里的任何文件**。

source [find interface/jlink.cfg]

transport select swd
adapter speed 4000

# ★ 关键一行：必须在 source target 之前设置
set FLASH_SIZE 0x20000            ;# 128 KB

source [find target/stm32f1x.cfg]
