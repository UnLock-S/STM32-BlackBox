# 一键配置（TC-01 用）：强制把 STM32F103C8T6 当作 **128 KB flash** 处理
#
# 背景：官方 target/stm32f1x.cfg 第 27–33 行 **本身就支持 FLASH_SIZE 变量覆盖**：
#         if { [info exists FLASH_SIZE] } { set _FLASH_SIZE $FLASH_SIZE } else { set _FLASH_SIZE 0 }
#       FLASH_SIZE = 0 表示自动探测（大多数工具探测到的都是 64 KB）。
#       在 source target 之前 set FLASH_SIZE 即可覆盖 —— **不需要修改安装目录里的任何文件**。
#
# 用法：
#   openocd -s <本目录> -s <xPack scripts 目录> -f sbb-128k.cfg
#
# TC-01 判定流程：
#   1. 用本配置连上板子
#   2. telnet 4444 端口执行：
#        flash probe 0
#        mwb 0x08010000 0xA5        ;# 往 64 KB 之外写一个字节
#        mdb 0x08010000 1           ;# 回读
#      回读到 0xa5 → 实际是 128 KB，OTA 走 A/B 双槽
#      回读到 0xff → 真的只有 64 KB，OTA 走单槽 + Bootloader 兜底（见 SDD 方案 B）

source [find interface/ch347.cfg]

# ★ 关键一行：必须在 source target 之前设置
set FLASH_SIZE 0x20000            ;# 128 KB

source [find target/stm32f1x.cfg]
