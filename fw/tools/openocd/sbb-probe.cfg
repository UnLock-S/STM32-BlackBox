# 一键配置（默认）：CH347 接口 + STM32F103 目标，flash 容量**自动探测**
#
# 用法（务必带上两个 -s 搜索路径，见 tools/openocd.sh）：
#   openocd -s <本目录> -s <xPack scripts 目录> -f sbb-probe.cfg
#
# 用途：日常烧写/调试、以及 TC-01 的"先看芯片报告多少"这一步。

source [find interface/ch347.cfg]
source [find target/stm32f1x.cfg]

# 复位策略：本项目板载有复位按键，SRST 可用；
# 若发现连接时反复失败，可改为 "reset_config srst_only srst_nogate"
#
# ★ 若报 "Error connecting DP: cannot read IDR"，按顺序排查：
#   1) **GND 是否共地** —— 不共地必然报这个，且现象和接反一模一样
#   2) TMS(→PA13/SWDIO) 与 TCK(→PA14/SWCLK) 是否接反 —— **接反零风险**，交换即可
#   3) 目标是否供电（蓝板电源 LED 是否亮）
#   4) 降速：bash fw/tools/openocd.sh --cmd "adapter speed 500"
#   5) 手动按住蓝板 RST 键不放，再执行连接命令，连上后松手
#      （抢在用户程序把 PA13/PA14 重配成 GPIO、关掉 SWD 之前）
#
# ⚠ 关于 --srst（复位时连接）：**当前这个 OpenOCD 构建不支持，实测会报
#   "Asserting SRST not supported!"**。根因是驱动里 ch347_configure_srst_gpio()
#   属于较新加入的功能（用 `adapter gpio srst <n>` 指定 GPIO；CH347T 模式 3 下
#   唯一可用的 GPIO 是 GPIO3 = Pin11/SCL）。我们的 xPack 0.12.0-7 (2025-10-04)
#   早于该功能。真需要的话，可换 openocd-org 仓库自动构建的 master 版 Windows 包。
#   → RST 线接上无害，先接好留给将来，但现在别指望它。
