#
# ─────────────────────────────────────────────────────────────────────────────
#  OpenOCD 接口配置：WCH CH347 (CH347T / CH347F)          —— 本项目自写
# ─────────────────────────────────────────────────────────────────────────────
#  为什么要自己写：
#    上游 OpenOCD 仓库**没有** tcl/interface/ch347.cfg（master 上实测 404），
#    但驱动本身已合入。xPack OpenOCD 0.12.0-7 的 bin 里已编入该驱动，
#    可用 `openocd -c "adapter list"` 验证，会看到：  ch347  { jtag swd }
#
# ─────────────────────────────────────────────────────────────────────────────
#  硬件前置条件（摘自 OpenOCD 官方文档 doc/openocd.texi §2590，逐条都要满足）
# ─────────────────────────────────────────────────────────────────────────────
#   1. CH347T 必须拨到 **mode 3（UART + JTAG）**；其他模式不会出现 JTAG/SWD 接口。
#      注意：即使走 SWD，拨码也必须选到含 JTAG 的那一档。
#
#   2. VID/PID 自动搜索：0x1a86 配
#        0x55dd  CH347T (mode 3)
#        0x55de  CH347F
#        0x55e7  其他变体
#      通常无需手动指定；认不到时见文件末尾的注释行。
#
#   3. **CH347T 固件版本很关键**（用 WCH 官方工具升级到最新）：
#        < 2.41   只能 bitwise 模式，性能差
#        = 2.41   JTAG 时钟畸变；**SWD 根本没实现**
#        >= 4.41  SWD 时钟上限 1 MHz；且"读 AP 寄存器"后 SWDIO 会被误拉高 392 ns，
#                 部分器件因此返回奇偶校验错误 —— 必要时在 SWDIO 上串一个电阻抑制
#
#   4. Windows 驱动分两路，别搞混：
#        · JTAG/SWD 那一组接口 → 必须绑定 **WinUSB (libusb)**，否则 OpenOCD 打不开设备
#        · 串口那一组 → 保留 WCH 的 **VCP 驱动**（给 UART 日志与命令台用）
#
# ─────────────────────────────────────────────────────────────────────────────

adapter driver ch347
transport select swd

# CH347T 的 SWD 时钟硬上限就是 1 MHz（见上文第 3 条）——
# 先用保守值保证能连上，通了再逐步下调尝试更高速度
adapter speed 1000

# 自动搜索认不到设备时，取消下面这行的注释显式指定（CH347T in mode 3）：
# adapter usb vid_pid 0x1a86 0x55dd
